# Atlas investigation benchmarks — RWATP core (rwatp-core)
# Repository: git@github-vesta:wombytech/rwatp-core.git
#
# Each [[case]] runs `atlas investigate <anchors>` and scores the result.
# expected_center / supporting_evidence / false_positive_alert are matched
# as *substrings* of candidate file paths.
#
# HARNESS LIMITATION: `atlas eval` calls `investigate(&anchors, …)` directly —
# the raw anchor path. It never routes through `options_from_question` /
# `build_evidence_packet`, so natural-language *question* mode cannot be
# expressed here: a sentence passed as a single anchor is matched literally and
# hits nothing. The question-mode regression that motivated this corpus is
# recorded in docs/decisions/2026-08-10-nl-question-mode-seed-order-collapse.md
# and must be checked by running the CLI directly until the harness grows a
# question-mode case kind.

# --- Support ticket subsystem -----------------------------------------------

[[case]]
id          = "rwatp-support-tickets-anchors"
description = "Anchor terms for the support ticket subsystem"
repo        = "/home/sanoy/Vesta/rwatp-core"
db          = "/home/sanoy/Vesta/rwatp-core/atlas.db"
anchors     = ["support", "ticket"]
expected_center      = [
  "src/modules/support/services/support-ticket.service.ts",
  "src/modules/support/models/support-ticket.model.ts",
]
supporting_evidence  = [
  "src/modules/support/services/ticket-transitions.ts",
  "tests/support/test-support-tickets.ts",
]
false_positive_alert = []

